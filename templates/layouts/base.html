<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A2E57">
  <title>{% block title %}{{ biz.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Gulf work visa, Umrah, family and tourist visas and air tickets – Noor Travels Services, Kasia, Kushinagar.{% endblock %}">
  <link rel="icon" type="image/png" href="{{ asset('img/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ asset('img/favicon.png') }}">
  <link rel="preload" href="/static/fonts/inter-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
  {# collapsed sidebar: set before first paint so the page does not jump #}
  <script>try{if(localStorage.getItem("sb-mini")==="1")document.documentElement.classList.add("sb-mini")}catch(e){}</script>
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  <script src="{{ asset('js/htmx.min.js') }}" defer></script>
  <script src="{{ asset('js/app.js') }}" defer></script>
</head>
{# hx-boost: every normal link and form becomes an AJAX swap of <body> – no full page reload #}
<body hx-boost="true" hx-indicator="#page-loader" class="min-h-screen flex flex-col font-sans antialiased">
  <div id="page-loader" class="htmx-indicator fixed inset-x-0 top-0 z-[70] h-[3px]"></div>
  {% block body %}{% endblock %}
</body>
</html>
