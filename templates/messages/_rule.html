<div id="rule-{{ t.trigger }}" class="flex items-center gap-3 px-4 py-3">
  <button type="button" role="switch" aria-checked="{{ 'true' if t.is_active else 'false' }}" aria-label="{{ t.title }}"
          hx-post="/app/messages/rules/{{ t.trigger }}" hx-target="#rule-{{ t.trigger }}" hx-swap="outerHTML"
          class="relative shrink-0 w-12 h-7 rounded-full transition {{ 'bg-green-600' if t.is_active else 'bg-slate-300' }}">
    <span class="absolute top-1 w-5 h-5 rounded-full bg-white shadow transition-all {{ 'left-6' if t.is_active else 'left-1' }}"></span>
  </button>
  <span class="flex-1"><span class="font-semibold">{{ t.title }}</span><span class="block text-xs text-slate-500">{{ when.get(t.trigger, '') }}</span></span>
  <a href="/app/messages/templates/{{ t.trigger }}" class="min-h-11 inline-flex items-center text-sm font-semibold text-brand-blue">Edit wording</a>
</div>
