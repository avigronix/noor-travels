# /etc/nginx/sites-available/noor-travels   (ln -s to sites-enabled)
# nginx has no SSL here: HTTPS terminates at Cloudflare, which talks to this server on port 80.
# Its own server block + its own upstream port (8030) – the app on 8020 is not touched.
# Cloudflare → SSL/TLS mode must be "Flexible" (nginx listens on 80 only), plus "Always Use HTTPS" on.

# /static/x?v=<hash> never changes (the app adds the hash) → cache for a year; without ?v → 1 day
map $arg_v $noor_static_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

upstream noor_travels_app {
    server 127.0.0.1:8030;
    keepalive 16;
}

# www.noortrip.in → noortrip.in (one address for Google and customers)
server {
    listen 80;
    listen [::]:80;
    server_name www.noortrip.in;
    return 301 https://noortrip.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name noortrip.in;

    # Real visitor IP from Cloudflare (list: https://www.cloudflare.com/ips/ – check it once a year)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 6m;                          # visa / profile photo uploads (app limit 5 MB)

    access_log /var/log/nginx/noor-travels.access.log;
    error_log  /var/log/nginx/noor-travels.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/csv text/plain application/xml;
    gzip_comp_level 6;
    gzip_min_length 800;
    gzip_vary on;

    # CSS / JS / logo straight from disk (cache: see map above). Uploads are NOT here – they go through the app (auth).
    location /static/ {
        alias /srv/noor-travels/static/;
        add_header Cache-Control $noor_static_cache;
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location / {
        proxy_pass http://noor_travels_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Cloudflare sends X-Forwarded-Proto: https – pass it on so redirects stay on https
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_buffering off;                          # CSV exports stream
    }
}
