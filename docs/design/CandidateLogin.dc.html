<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Noor Travels Services – Candidate login</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0070B8}a:hover{color:#005A94}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F8; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column">
  <div style="background: #0A2E57; color: #EFF6FF; padding: 40px 24px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: flex-start; background: #FFFFFF; border-radius: 10px; padding: 8px 12px"><img src="../../static/img/logo.png" alt="Noor Travels Services" style="height: 44px; width: auto; display: block"></div>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; line-height: 1.25; font-weight: 600">Apni file ka status dekhein</h1>
    <p style="margin: 0; font-size: 15px; color: #DBEAFE">Check your visa file status, next appointment and payments.</p>
  </div>
  <div style="flex: 1 1 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="cm" style="font-size: 15px; font-weight: 600">Mobile number / मोबाइल नंबर</label>
        <div style="display: flex; gap: 8px">
          <span style="height: 52px; display: flex; align-items: center; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; background: #FFFFFF; font-size: 16px">+91</span>
          <input id="cm" type="tel" inputmode="numeric" value="97XXXXXX45" style="flex: 1 1 auto; min-width: 0; height: 52px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 14px; font-size: 17px; font-family: inherit">
        </div>
        <span style="font-size: 13px; color: #475569">Wahi number jo office mein diya tha.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="cdob" style="font-size: 15px; font-weight: 600">Date of birth / जन्म तिथि</label>
        <input id="cdob" type="date" value="1996-06-12" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 14px; font-size: 17px; font-family: inherit">
        <span style="font-size: 13px; color: #475569">Passport par jo janam tithi hai.</span>
      </div>
      <a href="CandidateStatus.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 10px; background: #0070B8; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Meri file dekhein</a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #475569; text-align: center">
      <span>Madad ke liye office: Noor Travels Services, Kasia</span>
      <a href="#" style="font-weight: 600">WhatsApp par baat karein</a>
    </div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
