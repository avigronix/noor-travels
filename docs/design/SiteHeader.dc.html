<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noor Travels Services – Website header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0F172A; border-bottom: 1px solid #E5E7EB">
  <div style="max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; box-sizing: border-box">
    <a href="SiteHome.dc.html" aria-label="Noor Travels Services – home" style="display: flex; align-items: center; min-height: 48px">
      <img src="../../static/img/logo.png" alt="Noor Travels Services" style="height: 52px; width: auto; display: block">
    </a>
    <nav aria-label="Website" style="order: 3; flex: 1 1 100%; display: flex; gap: 4px; overflow-x: auto; justify-content: flex-start">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="{{ l.style }}">{{ l.label }}</a>
      </sc-for>
    </nav>
    <a href="Main.dc.html" style="order: 2; margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #0070B8; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
      Login
    </a>
  </div>
  <div aria-hidden="true" style="display: flex; height: 4px"><span style="flex: 45 1 0; background: #E8202A"></span><span style="flex: 40 1 0; background: #0070B8"></span><span style="flex: 15 1 0; background: #F7A21B"></span></div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","services","umrah","about","contact"],"default":"home"},"$preview":{"width":1280,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const base = 'flex: 0 0 auto; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 15px; text-decoration: none; white-space: nowrap; ';
    const items = [['home', 'Home', 'SiteHome.dc.html'], ['services', 'Services', 'SiteServices.dc.html'], ['umrah', 'Umrah', 'SiteUmrah.dc.html'], ['about', 'About us', 'SiteAbout.dc.html'], ['contact', 'Contact', 'SiteContact.dc.html']];
    return { links: items.map(([k, label, href]) => ({ label, href, style: base + (k === a ? 'color: #E8202A; font-weight: 700;' : 'color: #1F2937; font-weight: 500;') })) };
  }
}
</script>
</body>
</html>
